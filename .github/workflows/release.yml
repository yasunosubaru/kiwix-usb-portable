name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish assets for'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows GUI (tkinter, single file)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install -r requirements-build.txt
      - name: Build single-file GUI
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name KiwixUSB --distpath dist --workpath build --specpath . `
            src/KiwixUSB.py
      - name: Smoke test (binary must at least be well-formed PE)
        run: |
          $f = Get-Item dist\KiwixUSB.exe
          if ($f.Length -lt 5MB) { throw "suspiciously small executable" }
          Write-Host "OK $($f.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: dist/KiwixUSB.exe
          if-no-files-found: error

  build-winui:
    name: Windows GUI (WinUI 3, unpackaged)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained WinUI 3 app
        shell: pwsh
        run: |
          dotnet publish src/KiwixWinUI/KiwixWinUI.csproj -c Release -r win-x64 `
            --self-contained true -o "${{ runner.temp }}/winui"
      - name: Verify output and launch it
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}\winui"
          foreach ($f in 'KiwixWinUI.exe','KiwixWinUI.dll','KiwixWinUI.runtimeconfig.json') {
            if (-not (Test-Path "$out\$f")) { throw "missing $f" }
          }
          $files = Get-ChildItem $out -Recurse -File
          $mb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "$($files.Count) files, $mb MB"
          # A self-contained WinUI 3 app is ~480 files; far fewer means the
          # Windows App Runtime did not get bundled and it would not run.
          if ($files.Count -lt 300) { throw "suspiciously small WinUI output" }
          $p = Start-Process "$out\KiwixWinUI.exe" -PassThru
          Start-Sleep -Seconds 20
          if (-not (Get-Process KiwixWinUI -ErrorAction SilentlyContinue)) {
            throw "app exited immediately"
          }
          Write-Host "launch check OK (PID $($p.Id))"
          Stop-Process -Name KiwixWinUI -Force -ErrorAction SilentlyContinue
          Get-Process kiwix-serve -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Drive the real start button
        shell: pwsh
        run: |
          # There is no library on a runner, so the full running-state
          # assertions are skipped, but the start button is still pressed: that
          # is the path v1.1.0 shipped broken, and pressing it costs nothing.
          # A crash or a dead button fails here instead of in a user's hands.
          & ./scripts/test-gui-start.ps1 -Bundle "${{ github.workspace }}" -Exe "${{ runner.temp }}\winui\KiwixWinUI.exe"
          if ($LASTEXITCODE -ne 0) { throw "GUI end-to-end test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: gui-winui
          path: ${{ runner.temp }}/winui
          if-no-files-found: error

  build-linux:
    name: Linux GUI (glibc 2.36 baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must happen inside debian:12 -- building on ubuntu-latest would
      # raise the glibc floor to 2.39 and break Debian 12 / fnOS hosts.
      - name: Build inside debian:12 container
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          OUT_DIR="$RUNNER_TEMP/dist" bash scripts/build-linux-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: ${{ runner.temp }}/dist/KiwixUSB-linux-x86_64
          if-no-files-found: error

  build-kiwix-windows:
    name: kiwix-serve (Windows x86_64, executed to verify)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # This has to run on Windows, not on the ubuntu release job via pwsh.
      # Only a Windows host can actually execute kiwix-serve.exe, and that is
      # the only way to notice a build whose DLLs were left behind -- which is
      # how v1.1.0 first shipped a kiwix-serve.exe that died with
      # STATUS_DLL_NOT_FOUND the moment a user pressed "start service".
      - name: Fetch official Windows binaries
        shell: pwsh
        run: |
          $env:BUNDLE_DIR = $env:GITHUB_WORKSPACE
          ./scripts/fetch-kiwix-binaries.ps1
      - name: Prove the binary runs
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'app\windows-x86_64\kiwix-serve.exe'
          if (-not (Test-Path $exe)) { throw "kiwix-serve.exe was not fetched" }
          $v = & $exe '--version' 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit=$code"
          Write-Host $v
          if ($code -ne 0) { throw "kiwix-serve.exe --version failed: exit $code" }
          if ($v -notmatch 'kiwix-tools') { throw "unexpected --version output" }
          Get-ChildItem (Split-Path $exe) | Format-Table Name, Length -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: kiwix-windows
          path: app
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-winui, build-linux, build-kiwix-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Deliberately no `ref:` here. Pinning this to the release tag makes
        # workflow_dispatch build the *tag's* source, so fixes landed on main
        # are silently skipped. The tag is only a publishing target and is
        # passed to the release step as `tag_name` instead.
      # One subdirectory per artifact, on purpose. merge-multiple would flatten
      # all three into artifacts/, which (a) hides where the WinUI payload came
      # from and (b) drops its 486 runtime files straight into the directory
      # that the release step checksums and publishes.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Assert the layout right away rather than discovering it three steps later.
      - name: Assert every build job delivered its artifact
        run: |
          missing=0
          for d in gui-windows gui-linux gui-winui; do
            if [ -d "artifacts/$d" ]; then
              echo "  OK      artifacts/$d  ($(find "artifacts/$d" -type f | wc -l) files)"
            else
              echo "  MISSING artifacts/$d"
              missing=1
            fi
          done
          test -f artifacts/gui-windows/KiwixUSB.exe            || { echo "::error::no KiwixUSB.exe"; missing=1; }
          test -f artifacts/gui-linux/KiwixUSB-linux-x86_64     || { echo "::error::no KiwixUSB-linux-x86_64"; missing=1; }
          test -f artifacts/gui-winui/KiwixWinUI.exe            || { echo "::error::no KiwixWinUI.exe"; missing=1; }
          exit $missing
      # Third-party binaries are intentionally absent from git, so the
      # release job has to fetch them or the bundle ships incomplete.
      # BUNDLE_DIR must point at the repo root: the fetch scripts default
      # to <repo>/bundle, while the assemble step reads from app/.
      - name: Fetch kiwix static binaries (Linux)
        run: |
          BUNDLE_DIR="$GITHUB_WORKSPACE" bash scripts/fetch-kiwix-binaries.sh
      - name: Restore the verified Windows kiwix binaries
        # Comes from build-kiwix-windows, where the executable was actually
        # run. The previous `pwsh ... || echo warning` swallowed fetch failures
        # entirely, which is how a missing-DLL binary got published.
        uses: actions/download-artifact@v4
        with:
          name: kiwix-windows
          path: app
      - name: Confirm both kiwix-serve builds are in place
        run: |
          for f in app/linux-x86_64/kiwix-serve app/windows-x86_64/kiwix-serve.exe; do
            if [ -f "$f" ]; then
              echo "  OK      $f  $(du -h "$f" | cut -f1)"
            else
              echo "::error::missing $f"; exit 1
            fi
          done
          # A 3.x Windows build is only ~3.7 MB when it needs sibling DLLs;
          # 10 MB means it is self-contained. Print the whole set either way,
          # because this is exactly the detail that hid the v1.1.0 defect.
          echo "  --- app/windows-x86_64 ---"
          ls -l app/windows-x86_64/ | tail -n +2 | awk '{printf "    %-24s %10d\n", $9, $5}'
      - name: Build Docker offline image as legacy archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          mkdir -p app/docker
          # skopeo's docker-archive: transport writes the legacy layout that
          # older NAS importers accept (docker save would emit OCI layout).
          skopeo copy --quiet \
            docker://ghcr.io/kiwix/kiwix-serve:latest \
            docker-archive:app/docker/kiwix-serve-legacy.tar:ghcr.io/kiwix/kiwix-serve:latest
          ls -lh app/docker/
      - name: Assemble ready-to-use bundle
        run: |
          cp -r launcher bundle-stage
          mkdir -p bundle-stage/app/gui bundle-stage/zim
          cp artifacts/gui-linux/KiwixUSB-linux-x86_64 bundle-stage/app/gui/
          cp artifacts/gui-windows/KiwixUSB.exe            bundle-stage/app/gui/
          cp src/KiwixUSB.py                    bundle-stage/app/gui/
          cp zim/README.md                      bundle-stage/zim/
          cp zim/SHA256SUMS.example.txt         bundle-stage/
          cp -r docs                             bundle-stage/docs
          cp README.md                           bundle-stage/
          # WinUI 3 build is ~166 MB (self-contained .NET + Windows App SDK).
          # It goes into its own subfolder; start-gui.cmd prefers it and
          # falls back to the tkinter single file.
          if [ -d artifacts/gui-winui ]; then
            mkdir -p bundle-stage/app/gui/KiwixWinUI
            cp -r artifacts/gui-winui/. bundle-stage/app/gui/KiwixWinUI/
            echo "  WinUI 3: $(find bundle-stage/app/gui/KiwixWinUI -type f | wc -l) files"
          fi
          for d in linux-x86_64 windows-x86_64 docker; do
            if [ -d "app/$d" ]; then cp -r "app/$d" bundle-stage/app/; fi
          done
          chmod +x bundle-stage/start.sh bundle-stage/stop.sh bundle-stage/install-fnos.sh
          echo "--- bundle contents (top level) ---"
          find bundle-stage -maxdepth 3 -type d | sort
      - name: Assert the bundle is actually complete
        run: |
          missing=0
          for f in app/gui/KiwixUSB.exe app/gui/KiwixUSB-linux-x86_64 \
                   app/gui/KiwixWinUI/KiwixWinUI.exe \
                   app/linux-x86_64/kiwix-serve app/windows-x86_64/kiwix-serve.exe \
                   app/docker/kiwix-serve-legacy.tar start.sh start-gui.cmd; do
            if [ -f "bundle-stage/$f" ]; then
              echo "  OK      $f"
            else
              echo "  MISSING $f"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::bundle is incomplete - a published bundle with missing parts is worse than no bundle"
            exit 1
          fi
          # The WinUI 3 payload only works as a whole: a partial copy leaves a
          # launcher that starts and then dies on a missing runtime DLL. It is
          # ~480 files when complete, so anything near that is a broken copy.
          n=$(find bundle-stage/app/gui/KiwixWinUI -type f | wc -l)
          echo "  WinUI 3 runtime files: $n"
          if [ "$n" -lt 300 ]; then
            echo "::error::WinUI 3 payload is truncated ($n files, expected >= 300)"
            exit 1
          fi
      - name: Assert no ZIM payloads slipped in
        run: |
          if find bundle-stage -iname '*.zim' | grep -q .; then
            echo "::error::ZIM files must never be bundled"; exit 1
          fi
          echo "OK: no ZIM files in bundle"
      - name: Package + checksums
        run: |
          # NOTE: the zip must land INSIDE artifacts/, which is what the
          # release step globs. "../" from bundle-stage is the repo root.
          cd bundle-stage
          zip -qr ../artifacts/Kiwix-USB-bundle.zip .
          cd ../artifacts
          # The standalone Docker tar is published as its own asset, so it
          # must be present here to get a checksum too -- otherwise the
          # release ships 5 assets but only 3 are covered by SHA256SUMS.
          # The three build artifacts are copied up out of their per-artifact
          # subdirectories so artifacts/ holds exactly the published set.
          cp ../app/docker/kiwix-serve-legacy.tar .
          cp gui-windows/KiwixUSB.exe        .
          cp gui-linux/KiwixUSB-linux-x86_64 .
          test -f Kiwix-USB-bundle.zip || { echo "::error::bundle zip missing"; exit 1; }
          test -f kiwix-serve-legacy.tar  || { echo "::error::docker tar missing"; exit 1; }
          # An explicit list, not `sha256sum *`: artifacts/ also holds the
          # per-artifact subdirectories, and a glob would either try to hash
          # them or silently miss an asset the release step still uploads.
          ASSETS="Kiwix-USB-bundle.zip KiwixUSB.exe KiwixUSB-linux-x86_64 kiwix-serve-legacy.tar"
          for a in $ASSETS; do
            test -f "$a" || { echo "::error::missing asset $a"; exit 1; }
          done
          sha256sum $ASSETS > SHA256SUMS.txt
          # The checksum file must cover every published asset and nothing else.
          n=$(wc -l < SHA256SUMS.txt)
          echo "--- checksums ($n lines) ---"
          cat SHA256SUMS.txt
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 checksum lines, got $n"; exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push github.ref is refs/tags/vX; on workflow_dispatch it
          # is refs/heads/main, which the action rejects with
          # "GitHub Releases requires a tag". Accept the dispatch input too.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/KiwixUSB.exe
            artifacts/KiwixUSB-linux-x86_64
            artifacts/kiwix-serve-legacy.tar
            artifacts/SHA256SUMS.txt
            artifacts/Kiwix-USB-bundle.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Re-running a tag must not fail on "asset already exists"
          overwrite_files: true
